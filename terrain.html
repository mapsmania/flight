<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>3D Terrain Animation - The Matterhorn</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    
    <!-- MapLibre GL JS CSS & JS -->
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        .map-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 18px;
            font-family: sans-serif;
            font-size: 14px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 10;
            max-width: 300px;
        }
        .map-overlay h2 { margin: 0 0 5px 0; font-size: 16px; }
        .map-overlay p { margin: 0; color: #555; font-size: 12px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="map-overlay">
    <h2>The Matterhorn in 3D</h2>
    <p>Orbiting animation powered by MapLibre &amp; Mapterhorn.<br><em>Click or drag the map to pause rotation.</em></p>
</div>

<div id="map"></div>

<script>
    // Coordinates for the Matterhorn peak
    // Coordinates for the Matterhorn peak
    const matterhornCoords = [7.6586, 45.9763];
    let isInteracting = false;

    const map = new maplibregl.Map({

        container: 'map',

        style: 'https://tiles.openfreemap.org/styles/liberty',

        center: matterhornCoords,

        zoom: 11.5,

        pitch: 50,

        bearing: 0,

        maxPitch: 85

    });
    
    map.on('load', () => {
        // 1. Add Mapterhorn's elevation tile source with an explicit maxzoom
        map.addSource('mapt-dem', {
            type: 'raster-dem',
            url: 'https://tiles.mapterhorn.com/tilejson.json',
            tileSize: 512,
            maxzoom: 12  // <-- Prevents MapLibre from looking for elevation tiles past zoom 12
        });

        // 2. Enable 3D terrain
        map.setTerrain({
            source: 'mapt-dem',
            exaggeration: 1.4
        });

        // 3. Find the first label (symbol) layer so hillshading sits neatly beneath text
        const firstSymbolId = map.getStyle().layers.find(
            layer => layer.type === 'symbol'
        )?.id;

        map.addLayer({
            id: 'hillshading',
            type: 'hillshade',
            source: 'mapt-dem',
            paint: {
                'hillshade-shadow-color': '#473d3d',
                'hillshade-exaggeration': 0.5
            }
        }, firstSymbolId);

        // 4. Start the orbital rotation animation
        requestAnimationFrame(rotateCamera);
    });

    function rotateCamera() {
        if (!isInteracting) {
            const currentBearing = map.getBearing();
            // Rotate the bearing
            const newBearing = currentBearing + 0.15;
            
            // To keep the Matterhorn dead center while orbiting, 
            // we rotate around the target coordinate smoothly:
            map.jumpTo({
                center: matterhornCoords,
                bearing: newBearing,
                pitch: 55,
                zoom: 12.5
            });
        }
        requestAnimationFrame(rotateCamera);
    }

    // Pause automatic rotation as soon as the user interacts with the map
    ['mousedown', 'touchstart', 'wheel'].forEach(event => {
        map.getCanvas().addEventListener(event, () => {
            isInteracting = true;
        });
    });

    // Add standard navigation and 3D terrain toggle controls
    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.TerrainControl({
        source: 'mapt-dem',
        exaggeration: 1.4
    }), 'top-right');
</script>

</body>
</html>
