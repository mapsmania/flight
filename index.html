<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Flight Sim Lite</title>

    <!-- MapLibre -->
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />

    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* Simple cockpit HUD */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 8px 10px;
            border-radius: 6px;
        }

        #help {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 6px 8px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div id="hud">
    SPEED: <span id="speed">216 km/h</span><br>
    BEARING: <span id="bearing">343°</span><br>
    PITCH: <span id="pitch">65°</span>
</div>

    <div id="help">
        ↑ ↓ speed | ← → turn | W/S pitch
    </div>

<script type="module">

import FlightController from './FlightController.js';

let flight;

const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [8.0587, 46.4768],
    zoom: 11,
    pitch: 75,
    bearing: -18.6
});

map.on('load', () => {

    // Terrain elevation source
    map.addSource('terrainSource', {
        type: 'raster-dem',
        url: 'https://tiles.mapterhorn.com/tilejson.json',
        tileSize: 512,
        maxzoom: 12
    });

    // Separate source for hillshading
    map.addSource('hillshadeSource', {
        type: 'raster-dem',
        url: 'https://tiles.mapterhorn.com/tilejson.json',
        tileSize: 512,
        maxzoom: 12
    });

    // Enable 3D terrain
    map.setTerrain({
        source: 'terrainSource',
        exaggeration: 1.2
    });

    // Find first label layer
    const firstSymbolLayer = map.getStyle().layers.find(
        layer => layer.type === 'symbol'
    )?.id;

    // Add hillshade beneath labels
    map.addLayer({
        id: 'hills',
        type: 'hillshade',
        source: 'hillshadeSource',
        paint: {
            'hillshade-shadow-color': '#473B24',
            'hillshade-exaggeration': 0.5
        }
    }, firstSymbolLayer);

    // Initialise flight controller
    flight = new FlightController(map, {
        speed: 60,
        pitch: 65,
        bearing: -18.6
    });

    flight.start();
    updateHUD();
});

// Update cockpit display
function updateHUD() {
    if (!flight) return;

    document.getElementById('speed').textContent =
        `${(flight.speed * 3.6).toFixed(0)} km/h`;

    document.getElementById('bearing').textContent =
        `${((flight.bearing % 360 + 360) % 360).toFixed(0)}°`;

    document.getElementById('pitch').textContent =
        `${flight.pitch.toFixed(0)}°`;

    requestAnimationFrame(updateHUD);
}

</script>
</body>
</html>
